name: 同步源码

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'auto-update'
        required: true
        default: '同步源码'
  
  schedule:
    - cron: 30 6,18 * * *

env: 
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GIT_USER_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

jobs:
  build:
    runs-on: Ubuntu-20.04

    name: Update ${{matrix.target}}
    strategy:
      fail-fast: false
      matrix:
        target: [main,18.06,19.07,Lean-openwrt,Lienol-openwrt]  #[main,18.06,19.07,Lean-openwrt,Lienol-openwrt]  

    steps:
    - name: 准备完成
      uses: actions/checkout@v2

    - name: 初始化系统环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install git subversion git-core wget
        sudo timedatectl set-timezone "$TZ"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        echo "GIT_DATE=$(date "+%Y年%m月%d日-%H点%M分")" >> $GITHUB_ENV


    - name: 克隆源码
      env: 
        matrix_target: ${{matrix.target}}
      run: |
        cd $GITHUB_WORKSPACE
        chmod +x ${{matrix.target}}.sh
        git clone -b ${{matrix.target}} https://github.com/db-one/dbone-packages.git ${{matrix.target}}
        cd ${{matrix.target}}
        rm -Rf *
        git rm --cache *
        $GITHUB_WORKSPACE/${{matrix.target}}.sh

    - name: 应用源码更新
      env: 
        GITHUB_TOKEN: ${{ secrets.GIT_USER_TOKEN }}
      run: |
        [ -e $GITHUB_WORKSPACE/LICENSE ] && cp $GITHUB_WORKSPACE/LICENSE $GITHUB_WORKSPACE/${{matrix.target}}
        [ -e $GITHUB_WORKSPACE/README/${{matrix.target}}/README.md ] && cp $GITHUB_WORKSPACE/README/${{matrix.target}}/README.md $GITHUB_WORKSPACE/${{matrix.target}}
        cd $GITHUB_WORKSPACE/${{matrix.target}}
        git add .
        git commit -m "同步源码于$GIT_DATE" #|| true
        git push --quiet "https://${{ secrets.GIT_USER_TOKEN }}@github.com/db-one/dbone-packages.git" HEAD:${{matrix.target}}

    - name: 删除运行记录
      uses: db-one/delete-workflow-runs@main
      with:
        retain_days: 3     #保留最后多少记录不删除
        keep_minimum_runs: 0



